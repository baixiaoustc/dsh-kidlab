# kid-memory 的安装补丁：往当前 profile 里插一行「记忆小管家」。
# 这一行同时提供两半：🦉 记忆小管家卡片（client half，见 client.js）与
# mem_now / mem_pressure / mem_workbench / mem_top 四个模型工具（host half，见 tools.js）。
# 这里不写 config 就是全用插件默认值（enabled: true，timeoutMs: 8000）。
#
# 要改默认值，别改这个文件——在自己的用户层补丁 ~/.dsh/cordis.patch.yml 里
# 按 id 覆盖这一行（同 id 的 insert 行不能和这一行共存，会重复 id）：
#   - id: kid-memory
#     config: { timeoutMs: 12000 }
- insert:
    - id: kid-memory
      name: '@kidlab/dsh-kid-memory'
