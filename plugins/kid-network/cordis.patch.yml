# kid-network 的安装补丁：往当前 profile 里插一行「🕊️ 信鸽邮局」。
# 这一行同时提供两半：🕊️ 网络小探险卡片（client half，见 client.js）与
# net_my_identity / net_trace_trip / net_test_speed / net_who_is_home / net_dns
# 五个模型工具（host half，见 tools.js），卡片取数走 GET /kid-network/collect（见 index.js）。
# 这里不写 config 就是全用插件默认值（enabled: true，timeoutMs: 12000）。
#
# 要改默认值，别改这个文件——在自己的用户层补丁 ~/.dsh/cordis.patch.yml 里
# 按 id 覆盖这一行（同 id 的 insert 行不能和这一行共存，会重复 id）：
#   - id: kid-network
#     config: { timeoutMs: 20000 }
- insert:
    - id: kid-network
      name: '@kidlab/dsh-kid-network'
