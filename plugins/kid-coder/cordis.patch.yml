# kid-coder 的安装补丁：往当前 profile 里插一行「小教室」。
# 这一行同时提供三样东西：🐵 跑代码卡片（client half，见 client.js）、
# kid_run / kid_explain / kid_practice / kid_review / kid_steps 五个模型工具
# （host half，见 tools.js），以及卡片取数用的 POST /kid-coder/run 路由（见 index.js）。
# 这里不写 config 就表示全用插件默认值（enabled: true，runTimeoutSec: 8，sandbox: true）。
#
# 要改默认值，别改这个文件——在自己的用户层补丁 ~/.dsh/cordis.patch.yml 里
# 按 id 覆盖这一行（同 id 的 insert 行不能和这一行共存，会重复 id）：
#   - id: kid-coder
#     config: { kidName: 想想, age: 8, runTimeoutSec: 12 }
- insert:
    - id: kid-coder
      name: '@kidlab/dsh-kid-coder'
