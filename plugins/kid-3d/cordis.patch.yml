# kid-3d 的安装补丁：往当前 profile 里插一行「小小 3D 积木工坊」。
# 这一行同时提供：🧱 卡片（client half）与 kid3d_new / kid3d_build / kid3d_erase /
# kid3d_paint / kid3d_template / kid3d_open / kid3d_view / kid3d_export 八个工具（host half）。
# 这里不写 config 就表示全用插件默认值。要改默认值，别改这个文件——
# 在自己的用户层补丁（~/.dsh/cordis.patch.yml）里按 id 覆盖同名行即可：
#   - id: kid-3d
#     config: { enabled: true, workDir: 'kid3d', unitMm: 5 }
- insert:
    - id: kid-3d
      name: '@kidlab/dsh-kid-3d'
